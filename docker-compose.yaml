services:
  postgres:
    image: postgres:18rc1-bookworm
    container_name: pos_db
    ports:
      - '5445:5432'
    environment:
      POSTGRES_USER: 'pos'
      POSTGRES_PASSWORD: 'pos'
      POSTGRES_DB: 'pos'
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8.2.2-bookworm
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - pos_redis_data:/data

volumes:
  pos_pgdata:
  pos_redis_data:
